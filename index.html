<!doctype html>
<html lang="so">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kobci — dhawaan / coming soon</title>
<meta name="description" content="Kobci — nidaam maamul ganacsi oo af Soomaali ah. Dhawaan. / Business management software built in Somali. Coming soon.">
<link rel="icon" href="/brand/mark.svg" type="image/svg+xml">
<style>
  :root{
    --bg:#ffffff; --fg:#12211f; --muted:#5b6b68; --line:#e3e9e7; --accent:#0d7a6b;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0e1614; --fg:#e9f1ef; --muted:#9db0ac; --line:#22322f; --accent:#3ec9b0; }
  }
  :root[data-theme="dark"]{ --bg:#0e1614; --fg:#e9f1ef; --muted:#9db0ac; --line:#22322f; --accent:#3ec9b0; }
  :root[data-theme="light"]{ --bg:#ffffff; --fg:#12211f; --muted:#5b6b68; --line:#e3e9e7; --accent:#0d7a6b; }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
       display:flex;align-items:center;justify-content:center;padding:32px 20px;
       -webkit-text-size-adjust:100%}
  main{max-width:520px;width:100%;text-align:center}

  .logo{font-size:38px;font-weight:700;letter-spacing:-.03em;margin-bottom:6px;
        display:flex;align-items:center;justify-content:center;gap:12px}
  .logo span{color:var(--accent)}
  .logo .mark{width:36px;height:36px;color:var(--accent);flex:none}
  .badge{display:inline-block;font-size:13px;font-weight:600;color:var(--accent);
         border:1px solid var(--accent);border-radius:999px;padding:3px 14px;margin-bottom:28px}

  .so{font-size:19px;margin:0 0 6px}
  .en{font-size:17px;color:var(--muted);margin:0 0 32px}

  .rule{height:1px;background:var(--line);margin:0 auto 28px;max-width:180px}

  .contact p{margin:0 0 6px}
  .contact a{color:var(--accent);text-decoration:none;font-weight:600;font-size:18px}
  .contact a:hover{text-decoration:underline}
  .hours{font-size:14px;color:var(--muted);margin-top:18px}

  footer{margin-top:36px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <div class="logo">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <g fill="currentColor">
        <path d="M5 3.5 H10.5 V9.7 C8.4 11.8 6.4 14.2 5 16.6 Z"/>
        <path d="M6 28.5 L6 21.2 C6 17.6 8.2 14.7 11.2 12.4 C13.7 10.1 16.2 7.6 18.6 5.2 C18 4.1 17.3 3.3 16.2 2.8 C19.4 2.1 22.6 1.5 25.8 1 L26.4 1.6 C26.1 4.8 25.7 8 25.2 11.2 C24.3 10 23.4 9.5 22.6 9.5 C20 11.5 17.3 13.6 14.7 15.6 L26.2 28.5 H20.4 L11.5 18.2 C11 21.5 10.7 24.9 10.7 28.5 Z"/>
      </g>
    </svg>
    <span style="color:inherit">Kob<span>ci</span></span>
  </div>
  <div class="badge">Dhawaan · Coming soon</div>

  <p class="so">Nidaam maamul ganacsi oo af Soomaali ah.</p>
  <p class="en">Business management software, built in Somali.</p>

  <div class="rule"></div>

  <div class="contact">
    <p><a href="mailto:info@kobci.so">info@kobci.so</a></p>
    <p class="hours">Sabti – Khamiis, 8:00 – 18:00 (EAT)<br>Saturday – Thursday</p>
  </div>

  <footer>© 2026 Kobci</footer>
</main>
</body>
</html>
